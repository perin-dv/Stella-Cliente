<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Status do Pagamento</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
          margin: 0;
          padding: 0;
          background: #121212;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: Arial, sans-serif;
          color: white;
        }
        #statusScreenBrick_container {
          width: 100%;
          max-width: 480px;
          padding: 20px;
        }
    </style>
</head>
<body>
<div id="statusScreenBrick_container"></div>
<script>
    const mp = new MercadoPago("TEST-1943108a-b873-40a3-93bb-99993314ac7f", {
      locale: "pt-BR"
    });

    const bricksBuilder = mp.bricks();

    const urlParams = new URLSearchParams(window.location.search);
    const paymentId = urlParams.get("paymentId");

    if (!paymentId) {
      alert("paymentId não encontrado");
      throw new Error("paymentId não encontrado");
    }

    const renderStatusScreenBrick = async (bricksBuilder) => {
      const settings = {
        initialization: {
          paymentId: paymentId,
        },
        customization: {
          visual: {
            hideStatusDetails: false,
            hideTransactionDate: false,
            style: {
              theme: "dark"
            }
          },
          backUrls: {
            error: "https://stella-d-italia.web.app/carrinho",
            return: "https://stella-d-italia.web.app/home"
          }
        },
        callbacks: {
          onReady: async () => {
            try {
              const response = await fetch(
                `https://api.mercadopago.com/v1/payments/${paymentId}`,
                {
                  method: "GET",
                  headers: {
                    Authorization: "Bearer APP_USR-2276463477594202-061818-ecf7eb8faadfdbbde404df74df1c1e84-672045279"
                  }
                }
              );
              const data = await response.json();
              const status = data.status;
              const statusDetail = data.status_detail;

              console.log("🧾 STATUS:", status, "| DETALHE:", statusDetail);

              if (window.AndroidInterface) {
                window.AndroidInterface.retornarStatusPagamento(status, statusDetail || "");
              }
            } catch (error) {
              console.error("❌ Erro ao buscar status:", error);
              if (window.AndroidInterface) {
                window.AndroidInterface.retornarStatusPagamento("erro", "Erro ao consultar status");
              }
            }
          },
          onError: (error) => {
            console.error("❌ Erro no StatusScreenBrick:", error);
            if (window.AndroidInterface) {
              window.AndroidInterface.retornarStatusPagamento("erro", "Erro ao renderizar Brick");
            }
          }
        }
      };

      await bricksBuilder.create("statusScreen", "statusScreenBrick_container", settings);
    };

    renderStatusScreenBrick(bricksBuilder);
</script>
</body>
</html>
