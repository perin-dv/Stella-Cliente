<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        body {
          margin: 0;
          padding: 0;
          background: #121212;
          font-family: Arial, sans-serif;
          color: white;
        }
        .container {
          max-width: 480px;
          margin: 0 auto;
          padding: 16px;
        }
        #paymentBrick_container {
          padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="paymentBrick_container"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const preferenceId = urlParams.get("preference_id");
    const valor = parseFloat(urlParams.get("valor"));
    const email = urlParams.get("email");
    const empresaId = urlParams.get("empresaId");
    const clienteId = urlParams.get("clienteId");
    const pedidoId = urlParams.get("pedidoId");

    const mp = new MercadoPago('TEST-1943108a-b873-40a3-93bb-99993314ac7f', {
      locale: 'pt-BR'
    });

    const bricksBuilder = mp.bricks();

    const renderPaymentBrick = async (bricksBuilder) => {
      const settings = {
        initialization: {
          amount: valor,
          preferenceId: preferenceId,
          payer: { email: email }
        },
        customization: {
          paymentMethods: {
            atm: "all",
            creditCard: "all",
            debitCard: "all",
            maxInstallments: 1
          },
          visual: {
            style: {
              theme: "dark"
            }
          }
        },
        callbacks: {
          onReady: () => {
            console.log("🟢 Brick pronto");
          },
          onSubmit: ({ selectedPaymentMethod, formData }) => {
            return new Promise((resolve, reject) => {
              fetch("https://us-central1-stella-d-italia.cloudfunctions.net/process_payment", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(formData),
              })
              .then((response) => response.json())
              .then((json) => {
                console.log("🔁 Retorno pagamento:", json);
                window.location.href = `status_pagamento.html?paymentId=${json.id}&empresaId=${empresaId}&clienteId=${clienteId}&pedidoId=${pedidoId}`;
                resolve();
              })
              .catch((error) => {
                console.error("❌ Erro ao processar:", error);
                alert("Erro ao processar o pagamento.");
                reject();
              });
            });
          },
          onError: (error) => {
            console.error("❌ Erro no Brick:", error);
            alert("Erro no formulário de pagamento.");
          }
        }
      };

      window.paymentBrickController = await bricksBuilder.create(
        "payment",
        "paymentBrick_container",
        settings
      );
    };

    renderPaymentBrick(bricksBuilder);
</script>
</body>
</html>
