<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pagamento com Pix</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        body {
          background-color: #121212;
          font-family: Arial, sans-serif;
          color: #fff;
          margin: 0;
          padding: 20px;
        }
        #paymentBrick_container {
          background: #1e1e1e;
          padding: 20px;
          border-radius: 12px;
          max-width: 420px;
          margin: auto;
          box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<div id="paymentBrick_container"></div>

<script>
    const mp = new MercadoPago('APP_USR-168882420676566-061112-5d6ef22e265f8b1136933e29caa272ba-697565152', {
      locale: 'pt-BR'
    });

    const bricksBuilder = mp.bricks();

    const renderPaymentBrick = async (bricksBuilder) => {
      const settings = {
        initialization: {
          amount: 100, // Substitua dinamicamente com valor real
        },
        customization: {
          visual: { style: { theme: 'dark' } },
          paymentMethods: {
            creditCard: true,
            debitCard: true,
            pix: true,
            ticket: false,
            bankTransfer: true
          }
        },
        callbacks: {
          onSubmit: (data) => {
            return new Promise((resolve, reject) => {
              fetch("https://us-central1-apkstella.cloudfunctions.net/process_payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
              })
              .then(response => response.json())
              .then(result => {
                alert("✅ Pagamento realizado com sucesso!");
                resolve();
              })
              .catch(error => {
                alert("❌ Falha ao processar pagamento.");
                reject();
              });
            });
          },
          onError: (error) => {
            console.error("Erro no Payment Brick:", error);
          },
          onReady: () => {
            console.log("Payment Brick pronto");
          }
        }
      };
      window.paymentBrickController = await bricksBuilder.create('payment', 'paymentBrick_container', settings);
    };

    renderPaymentBrick(bricksBuilder);
</script>
</body>
</html>
